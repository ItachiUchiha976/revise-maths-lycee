<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Logo Maths avec Fred">
  <!-- Logo Maths avec Fred (créé 27/07/2026) : badge navy, pi doré, courbe de progression -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243468"/>
      <stop offset="1" stop-color="#161f45"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf4d"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#fond)" stroke="#3d4f8f" stroke-width="1.5"/>
  <!-- courbe de progression (l'élève qui monte) -->
  <path d="M12 74 Q34 70 50 52 T84 22" fill="none" stroke="#8fa3e8" stroke-width="4"
        stroke-linecap="round" opacity="0.55"/>
  <circle cx="84" cy="22" r="5" fill="#8fa3e8" opacity="0.85"/>
  <!-- π doré -->
  <g fill="url(#or)">
    <rect x="22" y="30" width="52" height="10" rx="5"/>
    <rect x="31" y="34" width="10" height="36" rx="5"/>
    <path d="M55 34 h10 v26 a7 7 0 0 0 7 7 h1 a4.5 4.5 0 0 1 0 9 h-3 a15 15 0 0 1 -15 -15 z"/>
  </g>
</svg>
