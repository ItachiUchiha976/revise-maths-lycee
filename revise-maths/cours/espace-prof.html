<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace prof — Tableau de bord de Fred · Cours de maths en visio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://mathsavecfred.fr/revise-maths/cours/espace-prof.html" />
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a56a0">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
<!--
  ESPACE PROF v2 (27/07/2026) — SYNCHRONISÉ sur cours-api (VPS).
  Accès par clé admin (Secrets BOS → outils_tiers.cours_api.admin_key).
  Vue : cours à venir (toutes réservations Cal.com), élèves, fichiers reçus,
  envoi de fiches, notes de suivi (privées ou visibles élève).
-->
<style>
:root { --navy:#1e1b4b; --indigo:#3730a3; --amber:#f59e0b; --bg:#f6f7fb; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI",system-ui,Arial,sans-serif; background:var(--bg); color:#17181c; line-height:1.55; }
header { background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
header a { color:#c7d2fe; text-decoration:none; font-size:14px; }
h1 { font-size:19px; margin:0; }
main { max-width:960px; margin:0 auto; padding:18px 14px 60px; }
.carte { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px 18px; margin:14px 0; box-shadow:0 1px 3px rgba(0,0,0,.05); }
h2 { font-size:17px; color:var(--indigo); margin:0 0 10px; }
button, .btn { background:var(--indigo); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14.5px; cursor:pointer; text-decoration:none; display:inline-block; margin:2px 4px 2px 0; }
button.second, .btn.second { background:#eef2ff; color:var(--indigo); border:1px solid #c7d2fe; }
input, select, textarea { padding:9px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14.5px; width:100%; margin:4px 0 8px; }
.cours { border-left:4px solid var(--amber); background:#fffbeb; border-radius:8px; padding:10px 14px; margin:10px 0; }
.badge { display:inline-block; background:#eef2ff; color:var(--indigo); border-radius:999px; padding:2px 10px; font-size:12.5px; margin:2px 6px 2px 0; font-weight:600; }
.eleve { border:1px solid #e5e7eb; border-radius:10px; padding:10px 14px; margin:8px 0; }
.fichier { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed #e5e7eb; font-size:14px; gap:8px; flex-wrap:wrap; }
.petit { font-size:13px; color:#6b7280; }
.msg { padding:9px 12px; border-radius:8px; margin:8px 0; font-size:14px; }
.msg.ok { background:#ecfdf5; color:#065f46; }
.msg.err { background:#fef2f2; color:#991b1b; }
.note { background:#f5f7ff; border-left:3px solid var(--indigo); border-radius:6px; padding:6px 10px; margin:6px 0; font-size:13.5px; }
#ecran-app { display:none; }
.grille2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:720px) { .grille2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>👨‍🏫 Espace prof — Fred</h1>
  <nav><a href="index.html">Page cours</a> · <a href="classe.html">Salle</a> · <a href="espace-eleve.html">Vue élève</a></nav>
</header>
<main>

<section id="ecran-login" class="carte">
  <h2>Accès professeur</h2>
  <input type="password" id="in-cle" placeholder="Clé d'accès (Secrets BOS → cours_api.admin_key)">
  <button id="btn-entrer">Entrer</button>
  <div id="login-msg"></div>
</section>

<section id="ecran-app">
  <div class="carte">
    <h2>📅 Prochains cours</h2>
    <div id="prochains"></div>
  </div>

  <div class="grille2">
    <div class="carte">
      <h2>🧑‍🎓 Élèves</h2>
      <div id="eleves"></div>
    </div>
    <div class="carte">
      <h2>📥 Fichiers reçus / envoyés</h2>
      <div id="fichiers"></div>
      <hr style="border:none;border-top:1px dashed #e5e7eb;margin:12px 0">
      <p class="petit" style="margin:0 0 4px"><b>Envoyer une fiche à un élève :</b></p>
      <select id="fiche-eleve"></select>
      <input type="file" id="fiche-fichier" accept=".pdf,.png,.jpg,.jpeg">
      <button id="btn-fiche" class="second">📤 Envoyer la fiche</button>
      <div id="fiche-msg"></div>
    </div>
  </div>

  <div class="carte">
    <h2>📝 Note de suivi (après un cours)</h2>
    <select id="note-eleve"></select>
    <textarea id="note-texte" rows="3" placeholder="Notions vues, points à retravailler, devoirs donnés…"></textarea>
    <label class="petit"><input type="checkbox" id="note-visible" style="width:auto"> Visible par l'élève dans son espace</label><br>
    <button id="btn-note">Enregistrer la note</button>
    <div id="note-msg"></div>
  </div>
</section>
</main>

<script>
const API = "https://api.tonargentexplique.fr/cours";
let cle = localStorage.getItem("cours_admin_key") || "";
const $ = (id) => document.getElementById(id);
const echap = (s) => String(s || "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const dateFR = (ts) => new Date(ts).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const heureFR = (ts) => new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function msg(el, texte, ok) { $(el).innerHTML = texte ? `<div class="msg ${ok ? "ok" : "err"}">${texte}</div>` : ""; }
async function api(chemin, options = {}) {
  options.headers = Object.assign({ "Content-Type": "application/json", "X-Admin-Key": cle }, options.headers || {});
  const r = await fetch(API + chemin, options);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erreur || "erreur");
  return d;
}

$("btn-entrer").onclick = async () => {
  cle = $("in-cle").value.trim();
  try {
    await api("/admin/tout");
    localStorage.setItem("cours_admin_key", cle);
    charger();
  } catch (e) { msg("login-msg", "Clé invalide.", false); }
};

let donnees = null;
async function charger() {
  try { donnees = await api("/admin/tout"); }
  catch (e) { localStorage.removeItem("cours_admin_key"); return; }
  $("ecran-login").style.display = "none";
  $("ecran-app").style.display = "block";

  $("prochains").innerHTML = donnees.a_venir.length ? donnees.a_venir.map((c) => `
    <div class="cours">
      <b>${dateFR(c.debut)} · ${heureFR(c.debut)}–${heureFR(c.fin)}</b>
      <span class="badge">${echap(c.format)}</span>
      ${(c.attendees || []).map((a) => `<span class="badge">👤 ${echap(a.nom || a.email)}</span>`).join("")}
      ${c.reponses && c.reponses.objectif ? `<span class="badge">🎯 ${echap(c.reponses.objectif)}</span>` : ""}
      ${c.reponses && c.reponses.classe ? `<span class="badge">${echap(c.reponses.classe)}</span>` : ""}
      <div style="margin-top:6px">
        ${c.lien_visio ? `<a class="btn" href="${echap(c.lien_visio)}" target="_blank" rel="noopener">🎥 Lancer la visio</a>` : ""}
        <a class="btn second" href="classe.html" target="_blank">🖊️ Salle + tableau</a>
      </div>
    </div>`).join("") : '<p class="petit">Aucun cours à venir.</p>';

  const opts = donnees.eleves.map((e) => `<option value="${echap(e.email)}">${echap(e.nom || e.email)}</option>`).join("");
  $("fiche-eleve").innerHTML = opts || "<option value=''>aucun élève</option>";
  $("note-eleve").innerHTML = opts || "<option value=''>aucun élève</option>";

  $("eleves").innerHTML = donnees.eleves.length ? donnees.eleves.map((e) => {
    const notes = (donnees.notes[e.email] || []).slice(-3).reverse();
    return `<div class="eleve"><b>${echap(e.nom || "(sans nom)")}</b> <span class="petit">${echap(e.email)}${e.classe ? " · " + echap(e.classe) : ""}</span>
      ${notes.map((n) => `<div class="note">${n.visible_eleve ? "👁️" : "🔒"} <span class="petit">${new Date(n.date).toLocaleDateString("fr-FR")}</span> ${echap(n.texte)}</div>`).join("")}
    </div>`;
  }).join("") : '<p class="petit">Aucun élève pour l\'instant — ils apparaissent dès leur 1ʳᵉ réservation.</p>';

  $("fichiers").innerHTML = donnees.fichiers.length ? donnees.fichiers.map((f) => `
    <div class="fichier"><span>${f.de === "prof" ? "👨‍🏫→" : "📥"} ${echap(f.nom)} <span class="petit">· ${echap(f.eleve)} · ${new Date(f.date).toLocaleDateString("fr-FR")}</span></span>
    <a class="btn second" href="${API}/fichiers/${f.id}?t=${encodeURIComponent(cle)}" target="_blank">Ouvrir</a></div>`).join("")
    : '<p class="petit">Aucun fichier.</p>';
}

$("btn-fiche").onclick = () => {
  const f = $("fiche-fichier").files[0];
  const dest = $("fiche-eleve").value;
  if (!f || !dest) return msg("fiche-msg", "Choisis un élève et un fichier.", false);
  const lecteur = new FileReader();
  lecteur.onload = async () => {
    try {
      await api("/fichiers", { method: "POST", body: JSON.stringify({ nom: f.name, contenu_b64: lecteur.result.split(",")[1], pour_eleve: dest }) });
      msg("fiche-msg", "Fiche envoyée dans l'espace de l'élève ✔", true);
      charger();
    } catch (e) { msg("fiche-msg", e.message, false); }
  };
  lecteur.readAsDataURL(f);
};

$("btn-note").onclick = async () => {
  try {
    await api("/admin/note", { method: "POST", body: JSON.stringify({
      email: $("note-eleve").value, texte: $("note-texte").value, visible_eleve: $("note-visible").checked }) });
    msg("note-msg", "Note enregistrée ✔", true);
    $("note-texte").value = "";
    charger();
  } catch (e) { msg("note-msg", e.message, false); }
};

if (cle) charger();
</script>
</body>
</html>
